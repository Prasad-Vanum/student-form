<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color:rgb(218, 165, 204);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    form{
        background-color:rgb(75, 183, 219); 
    }
    </style>
</head>
<body>
    <h1>
    Student Registration form </h1>
    <h2>Fill the form below to register</h2>
    <form>
        <label>Name:</label>
        <input type="text" id="name" required><br><br>

        <label>Email:</label>
        <input type="email" id="email" required><br><br>

        <label>Reg No:</label>
        <input type="text" id="reg_no" required><br><br>
        <label>Phone No:</label>
        <input type="tel" id="phone" required><br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male" required> Male
        <input type="radio" name="gender" value="female" required> Female<br><br>
        <label>Course:</label>
        <select id="course" name="course" required>
            <option >Select Course</option>
            <option >CSE</option>
            <option >ECE</option>
            <option >EEE</option>
            <option >MECH</option>
        </select><br><br>   
        <label>Address:</label>
        <textarea></textarea><br><br>
        <button onclick="a()" id="btn">Submit</button>
        <button>Reset</button>

    </form>
    <script>
       alert("Welcome to Student Registration Form");
       function a()
       {
        alert("Form Submitted Successfully");
       }

        const btn = document.getElementById("btn");

        btn.onclick = function () {
            console.log("Button clicked!");
        };
    </script>

</body>
</html>
